name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Check page structure and local links
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check nav-toggle.js
          node --check verticals-constellation.js
          node --check verticals/_generate.mjs
